<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Heapstead</title>
    <style>
      :root { color-scheme: light; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #d9d0c0; }
      #view { display: block; width: 100vw; height: 100vh; }
      #debug-overlay {
        position: fixed; top: 16px; left: 16px; margin: 0;
        font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: pre; color: #43392e;
        background: linear-gradient(
          180deg, rgba(253, 250, 244, 0.9), rgba(244, 237, 226, 0.86));
        border: 1px solid rgba(96, 80, 62, 0.22);
        border-radius: 10px; padding: 13px 16px 14px;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.7) inset,
          0 6px 22px -8px rgba(60, 48, 34, 0.45);
        backdrop-filter: blur(7px);
        pointer-events: none; letter-spacing: 0.015em;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.45);
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
